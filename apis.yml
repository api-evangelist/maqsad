aid: maqsad
name: Maqsad
description: >-
  Maqsad is Pakistan's leading online entry-test preparation platform, helping
  students prepare for standardized university entrance exams including MDCAT,
  ECAT, BCAT and O-Level. The platform delivers daily live classes, recorded
  video lectures, 15,000+ practice MCQs per exam, weekly mock tests, real-time
  doubt-solving and academic counseling through student-facing mobile apps and
  web access. Founded in 2021 and backed by Speedinvest, Maqsad reports 4M+
  downloads and tens of thousands of enrolled students placed into universities
  such as NUST, IBA and DUHS. It operates as a business-to-consumer education
  company and does not currently publish a developer API, documentation or
  developer portal.
